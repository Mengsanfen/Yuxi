# 单位信息配置文件
# 用于配置网站的基本信息、品牌信息等

# 组织信息
organization:
  name: "NexaMind"           # 完整组织名称
  logo: "/favicon.svg"       # Logo文件路径（放在 web/public 目录下）
  avatar: "/avatar.jpg"      # 头像文件路径（放在 web/public 目录下）
  login_bg: "/login-bg.jpg"  # 登录背景图片路径（放在 web/public 目录下）

# 项目信息
branding:
  name: "NexaMind"
  title: "NexaMind"     # 系统标题
  subtitle: "融合 RAG、知识图谱与智能体编排的知识中枢"          # 副标题（subtitles 为空时使用）
  badge: "RAG · Knowledge Graph · Agent Workflow"
  subtitles:
    - "融合 RAG、知识图谱与智能体编排的知识中枢"
    - "统一管理知识库、模型、Agent 与工具链"
    - "让文档可检索，让知识可关联，让回答可追溯"
    - "支持多步骤任务编排与异步智能体运行"
    - "面向个人与团队知识管理的 AI 应用底座"

features:
  - label: "RAG 知识库"
    value: "文档问答"
    description: "支持文档解析、分块、向量检索与引用追溯"
    icon: "knowledge"
  - label: "知识图谱"
    value: "关系推理"
    description: "融合图数据库查询，增强复杂知识关联分析"
    icon: "graph"
  - label: "智能体编排"
    value: "工具调用"
    description: "支持 Agent 配置、上下文管理与多步骤任务执行"
    icon: "agent"
  - label: "容器化部署"
    value: "一键启动"
    description: "通过 Docker Compose 编排前后端与多类存储服务"
    icon: "deploy"



# 页脚信息
footer:
